<style>
/* Layout: one practice "track" — status strip, prompt + timeline, degree slots, keyboard, then progress map and settings. On phones the actions dock to the bottom edge. */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f5f6f9; --ink:#161920; --muted:#5b6271; --line:#d4d8e0;
  --accent:#b8740f; --accent-soft:#f6e6c9; --on-accent:#ffffff;
  --good:#1d7f55; --good-soft:#d5efe2; --bad:#bf3434; --bad-soft:#f7dada; --warn:#c25a0a; --warn-soft:#fbe3cf;
  --reveal:#3d62c4; --reveal-soft:#dfe6fa;
  --key-white:#fdfdfd; --key-white-edge:#c9ced8; --key-black:#1b1d23; --scrim:rgba(20,22,28,.45);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#191c23; --surface-2:#20242c; --ink:#e8eaf0; --muted:#949bab; --line:#2b303b;
  --accent:#eaa63c; --accent-soft:#3a2c14; --on-accent:#1a1205;
  --good:#3fc58b; --good-soft:#163428; --bad:#f06a6a; --bad-soft:#3b1c1e; --warn:#f2913f; --warn-soft:#3d2512;
  --reveal:#86a2f2; --reveal-soft:#1e2742;
  --key-white:#e4e6eb; --key-white-edge:#9aa0ad; --key-black:#08090b; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#191c23; --surface-2:#20242c; --ink:#e8eaf0; --muted:#949bab; --line:#2b303b;
  --accent:#eaa63c; --accent-soft:#3a2c14; --on-accent:#1a1205;
  --good:#3fc58b; --good-soft:#163428; --bad:#f06a6a; --bad-soft:#3b1c1e; --warn:#f2913f; --warn-soft:#3d2512;
  --reveal:#86a2f2; --reveal-soft:#1e2742;
  --key-white:#e4e6eb; --key-white-edge:#9aa0ad; --key-black:#08090b; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Status strip */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between}
.brand-row{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;padding:3px 9px;font-family:var(--f-mono);font-size:.78rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.help-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px 3px 4px;font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.help-btn > span:first-child{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:.8rem}
.help-btn:hover{border-color:var(--ink)}
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal-bg{position:absolute;inset:0;background:var(--scrim)}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .25s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0}
.modal-close{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:44px;height:44px;font-size:1.4rem;line-height:1;flex:none}
.modal-close:hover{border-color:var(--ink)}
.modal-body{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;min-height:0;touch-action:pan-y}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tut-fig{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px}
.tut-svg{display:block;width:100%;height:auto;max-height:42vh}
.tut-text{display:flex;flex-direction:column;gap:4px;animation:fade .25s ease}
.tut-step{margin:0;font-family:var(--f-mono);font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.tut-text h3{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0}
.tut-text p:last-child{margin:0;max-width:60ch}
.tut-arrow{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;padding:0 14px;font-weight:700;font-size:1rem}
.tut-arrow.next{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tut-arrow:disabled{opacity:.35;cursor:default}
.tut-dots{display:flex;gap:8px}
.tut-dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line)}
.tut-dots button[aria-current="step"]{background:var(--accent);width:24px;border-radius:5px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.s-card{fill:var(--surface);stroke:var(--line)} .s-track{fill:var(--surface);stroke:var(--line)} .s-fill{fill:var(--accent)} .s-badfill{fill:var(--bad)}
.s-arrow{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round} .s-ah{fill:var(--accent)}
.s-t{fill:var(--ink);font-family:var(--f-body)} .s-m{fill:var(--muted);font-family:var(--f-mono)} .s-bad{fill:var(--bad);font-family:var(--f-mono)}
.s-big{fill:var(--ink);font-family:var(--f-display);font-weight:800} .s-name{fill:var(--ink);font-family:var(--f-display);font-weight:700}
.s-wk{fill:var(--key-white);stroke:var(--key-white-edge)} .s-bk{fill:var(--key-black)} .s-wk.s-hg,.s-bk.s-hg{fill:var(--good)} .s-wk.s-hr,.s-bk.s-hr{fill:var(--reveal)}
.s-slot{fill:var(--surface);stroke:var(--line)} .s-slot-ok{fill:var(--good-soft);stroke:var(--good)} .s-slot-cur{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.s-gt{fill:var(--good);font-family:var(--f-display);font-weight:700} .s-chip{fill:var(--surface);stroke:var(--line)}
.s-btn-good{fill:var(--good)} .s-btn{fill:var(--surface);stroke:var(--line)} .s-on{fill:#fff;font-family:var(--f-body);font-weight:700}
.s-ink{fill:var(--ink)} .s-onink{fill:var(--bg);font-family:var(--f-display);font-weight:800}
.s-pip{fill:var(--line)} .s-pipg{fill:var(--good)} .s-tile-new{fill:var(--surface);stroke:var(--accent);stroke-width:2} .s-spark{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.s-icon{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.lvl-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;gap:6px 14px;flex-wrap:nowrap}
.stat{display:flex;align-items:center;gap:7px;padding-left:14px;border-left:1px solid var(--line)}
.stat svg{width:22px;height:22px;flex:none}
.stat.combo svg{fill:var(--accent)} .stat.streak svg{fill:var(--warn)}
.stat.off svg{fill:var(--line)}
.stat-txt{display:flex;flex-direction:column;line-height:1.1}
.stat-txt b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat-txt small{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.pulse svg{animation:pulse .5s ease}
@keyframes pulse{50%{transform:scale(1.35)}}
.xp-txt{font-size:.7rem;color:var(--muted)}
.lvl{display:flex;align-items:center;gap:10px;min-width:0}
.lvl-badge{font-family:var(--f-display);font-weight:800;font-size:1.3rem;background:var(--ink);color:var(--bg);border-radius:10px;min-width:42px;height:42px;display:grid;place-items:center;padding:0 8px}
.lvl-meta{display:flex;flex-direction:column;gap:3px;min-width:120px}
.lvl-title{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.xpbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s ease}
.chip{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}

/* Stage */
.stage{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:border-color .3s,box-shadow .3s;padding:22px clamp(14px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.prompt-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.prompt-row > div{min-width:0}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 2px}
.prompt{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,7vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.prompt-sub{color:var(--muted);margin:6px 0 0;font-family:var(--f-mono);font-size:.85rem}
.score-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.score-box{display:grid;grid-template-columns:auto auto;align-items:baseline;justify-content:space-between;column-gap:14px;row-gap:2px;min-width:200px;
  border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 14px;transition:background .3s,border-color .3s}
.sb-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sb-val{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1;text-align:right;color:var(--muted)}
.sb-val .of{font-size:1rem;font-weight:700}
.sb-detail{grid-column:1 / -1;font-size:.82rem;font-weight:700;min-height:1.3em;color:var(--muted)}
.score-box.good{background:var(--good-soft);border-color:var(--good)} .score-box.good .sb-val,.score-box.good .sb-detail{color:var(--good)}
.score-box.warn{background:var(--warn-soft);border-color:var(--warn)} .score-box.warn .sb-val,.score-box.warn .sb-detail{color:var(--warn)}
.score-box.bad{background:var(--bad-soft);border-color:var(--bad)} .score-box.bad .sb-val,.score-box.bad .sb-detail{color:var(--bad)}
.session{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.session b{color:var(--ink);font-weight:500}
.stage.res-good{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.stage.res-warn{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.stage.res-bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

.timeline{position:relative;height:26px}
.timeline .track{position:absolute;inset:12px 0 auto;height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.timeline .fill{height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(1)}
.timeline .fill.low{background:var(--bad)}
.timeline .ticks{position:absolute;inset:0;pointer-events:none}
.timeline .ticks i{position:absolute;top:8px;width:1px;height:14px;background:var(--line)}
.timeline .secs{position:absolute;right:0;top:-8px;font-size:.78rem;color:var(--muted)}

.slots{display:grid;gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:5px 2px 7px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0;transition:background .2s,border-color .2s}
.slot .deg{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.slot .nn{font-family:var(--f-display);font-weight:700;font-size:clamp(.82rem,2.6vw,1.2rem);min-height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.cur{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.slot.ok{background:var(--good-soft);border-color:var(--good)} .slot.ok .nn{color:var(--good)}
.slot.rev{background:var(--reveal-soft);border-color:var(--reveal)} .slot.rev .nn{color:var(--reveal)}
.slot.err{animation:shake .3s;background:var(--bad-soft);border-color:var(--bad)}
.slot.pop{animation:popSlot .38s cubic-bezier(.3,1.6,.5,1)}
.slot.pop .nn{animation:riseIn .3s ease}
.slot.rev{animation:popSlot .35s ease backwards}
@keyframes popSlot{0%{transform:scale(.86)}60%{transform:scale(1.08)}100%{transform:none}}
@keyframes riseIn{from{transform:translateY(6px);opacity:0}}
.k-press{transform:translateY(2px) scaleY(.985);transform-origin:top;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.answers button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 10px;font-family:var(--f-display);font-weight:700;font-size:1rem;min-height:52px}
.answers button:hover:not(:disabled){border-color:var(--ink)}
.answers button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.answers button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .3s}
.answers button:disabled{cursor:default}
.answers button:disabled:not(.right):not(.wrong){opacity:.55}
.slot.chordslot .nn{font-size:clamp(.8rem,2.4vw,1.1rem)}
.slot.now{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gamebar .glbl{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.gamebar .glbl b{color:var(--ink);font-weight:500}
.gamebar .glbl.is-daily{color:var(--accent)}
.segs{display:flex;gap:4px;flex:1;min-width:120px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--line);transition:background .3s}
.segs i.good{background:var(--good)} .segs i.warn{background:var(--warn)} .segs i.bad{background:var(--bad)}
.segs i.cur{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.gamebar .gend{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.78rem;padding:0}
.daily{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.daily .dicon{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.daily .dicon svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.daily .dtxt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.daily .dtxt b{font-family:var(--f-display);font-weight:800;font-size:1.08rem}
.daily .dtxt span{font-size:.86rem;color:var(--muted)}
.daily.done .dicon{background:var(--good-soft)} .daily.done .dicon svg{stroke:var(--good)}
.end-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.end-big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.end-big small{font-size:1.4rem;color:var(--muted)}
.end-chips{display:flex;gap:8px;flex-wrap:wrap}
.end-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-weight:700;font-size:.86rem}
.end-chip.good{background:var(--good-soft);color:var(--good)} .end-chip.warn{background:var(--warn-soft);color:var(--warn)} .end-chip.bad{background:var(--bad-soft);color:var(--bad)}
.end-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.end-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.end-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.end-stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.end-stat b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.end-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.end-list li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;background:var(--surface-2);font-weight:700}
.end-list li i{width:10px;height:10px;border-radius:50%;flex:none}
.end-list li i.warn{background:var(--warn)} .end-list li i.bad{background:var(--bad)}
.end-list li small{margin-left:auto;font-family:var(--f-mono);font-weight:400;color:var(--muted)}
.end-body h3{font-family:var(--f-display);font-weight:700;font-size:1rem;margin:0}
.modal-foot.end-foot{justify-content:flex-end;flex-wrap:wrap}
.inv-tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:.85rem}
.inv-tag i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* Section switch */
.sections{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sections button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;border-radius:10px;padding:9px 8px;font-family:var(--f-display);font-weight:700;font-size:.98rem;color:var(--muted);min-width:0;white-space:nowrap}
.sections button span{overflow:hidden;text-overflow:ellipsis}
.sections button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sections button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sections button:hover:not([aria-selected="true"]){color:var(--ink)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Keyboard */
.kbd{position:relative;height:clamp(120px,22vw,170px);display:flex;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.wk{flex:1;background:var(--key-white);border:1px solid var(--key-white-edge);border-radius:0 0 6px 6px;margin-right:-1px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:background .08s}
.bk{position:absolute;top:0;height:60%;background:var(--key-black);border-radius:0 0 4px 4px;z-index:2;border:1px solid var(--key-black);transition:background .08s}
.wk span,.bk span{font-family:var(--f-mono);font-size:.62rem;color:#59606e;pointer-events:none}
.bk span{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#b9beca}
.wk,.bk{transition:background .08s,transform .08s}
.k-hit{background:var(--accent)!important}
.k-ok{background:var(--good)!important}
.k-bad{background:var(--bad)!important}
.k-rev{background:var(--reveal)!important}
.wk.k-ok span,.wk.k-rev span,.wk.k-bad span,.wk.k-hit span{color:#fff}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.big{font-size:1.1rem;padding:12px 22px}
.btn kbd{font-family:var(--f-mono);font-size:.7rem;opacity:.7;margin-left:6px}
.spacer{flex:1}
.hint{font-size:.82rem;color:var(--muted);margin:0}

.inputs{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;background:var(--surface)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pill.on .dot{background:var(--good)} .pill.err .dot{background:var(--bad)}
.pill.on{border-color:var(--good)}
.notice{font-size:.85rem;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:0}

/* Progress + settings */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;min-width:0}
details.panel > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0}
details.panel > summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:1.1rem}
details.panel[open] > summary::after{content:"−"}
.panel-body{padding:0 18px 16px;display:flex;flex-direction:column;gap:12px}
.map-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile .tn{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.1}
.tile .ta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.tile .pips{display:flex;gap:3px}
.tile .pips i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.tile .pips i.f{background:var(--accent)}
.tile.mastered .pips i.f{background:var(--good)}
.tile.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}

.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}
.types button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.types button:disabled{opacity:.5;cursor:not-allowed}
.types button small{font-family:var(--f-mono);font-size:.68rem}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input{flex:1;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.danger{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.8rem;align-self:flex-start;padding:0}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:700;font-family:var(--f-display);animation:pop .3s ease;text-align:center}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

/* Phone */
@media (max-width:640px){
  .answers{grid-template-columns:1fr 1fr}
  body{padding-block:12px calc(104px + env(safe-area-inset-bottom, 0px))}
  .wrap{gap:12px}

  .brand{font-size:1.15rem}
  .status{width:100%;justify-content:space-between;gap:8px}
  .lvl-card{padding:6px 10px 6px 6px}
  .stat{padding-left:10px}
  .lvl-badge{min-width:36px;height:36px;font-size:1.1rem}
  .lvl-meta{min-width:0;flex:1}
  .lvl{flex:1}
  .help-btn{padding:3px 4px}
  .help-btn > span:last-child{display:none}
  .modal{align-items:flex-end;padding-bottom:0}
  .modal-card{border-radius:16px 16px 0 0;max-height:92%}
  .modal-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
  .tut-arrow.next{flex:1;max-width:200px}
  .stage{padding:16px 14px;border-radius:12px;gap:14px}
  .sections{display:flex;overflow-x:auto;scrollbar-width:none}
  .sections::-webkit-scrollbar{display:none}
  .sections button{flex:0 0 auto;padding:8px 12px;font-size:.9rem}
  .score-col{align-items:stretch;width:100%}
  .score-box{min-width:0}
  .sb-val{font-size:1.35rem}
  .session{white-space:normal}
  .kbd{height:clamp(160px,34vh,260px)}
  .wk span{font-size:.7rem}
  .slots{gap:4px}
  .hint.keys{display:none}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);flex-wrap:nowrap;
    padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
  .actions .btn{flex:1;min-height:52px;font-size:1rem;padding:8px 10px}
  .actions .btn kbd,.actions .spacer{display:none}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
}

// ---------- Music theory ----------
const LETTERS = ["C","D","E","F","G","A","B"];
const NAT = [0,2,4,5,7,9,11];
const NAME_FR = {C:"Do",D:"Ré",E:"Mi",F:"Fa",G:"Sol",A:"La",B:"Si"};
const PC_FR = ["Do","Do♯","Ré","Ré♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const PC_EN = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const TYPES = [
  {id:"major", lvl:1, fr:"Majeur",            frP:"Majeures",        en:"Major",            enP:"Major",            iv:[0,2,4,5,7,9,11]},
  {id:"minor", lvl:1, fr:"Mineur",            frP:"Mineures",        en:"Minor",            enP:"Minor",    iv:[0,2,3,5,7,8,10]},
  {id:"pmaj",  lvl:2, fr:"Penta Majeure",     frP:"Penta Majeures",  en:"Major Pentatonic", enP:"Major Penta",      from:"major", pick:[0,1,2,4,5]},
  {id:"pmin",  lvl:2, fr:"Penta Mineure",     frP:"Penta Mineures",  en:"Minor Pentatonic", enP:"Minor Penta",      from:"minor", pick:[0,2,3,4,6]},
  {id:"harm",  lvl:3, fr:"Mineur Harmonique", frP:"Mineures Harm.",  en:"Harmonic Minor",   enP:"Harmonic Minor",   iv:[0,2,3,5,7,8,11]},
  {id:"blues", lvl:3, fr:"Blues",             frP:"Blues",           en:"Blues",            enP:"Blues",            from:"minor", pick:[0,2,3,4,6], blue:true},
  {id:"mel",   lvl:4, fr:"Mineur Mélodique",  frP:"Mineures Mél.",   en:"Melodic Minor",    enP:"Melodic Minor",    iv:[0,2,3,5,7,9,11], down:"minor"},
  {id:"dor",   lvl:5, fr:"Dorien",            frP:"Dorien",          en:"Dorian",           enP:"Dorian",           iv:[0,2,3,5,7,9,10]},
  {id:"mix",   lvl:5, fr:"Mixolydien",        frP:"Mixolydien",      en:"Mixolydian",       enP:"Mixolydian",       iv:[0,2,4,5,7,9,10]},
  {id:"lyd",   lvl:6, fr:"Lydien",            frP:"Lydien",          en:"Lydian",           enP:"Lydian",           iv:[0,2,4,6,7,9,11]},
  {id:"phr",   lvl:6, fr:"Phrygien",          frP:"Phrygien",        en:"Phrygian",         enP:"Phrygian",         iv:[0,1,3,5,7,8,10]},
  {id:"loc",   lvl:7, fr:"Locrien",           frP:"Locrien",         en:"Locrian",          enP:"Locrian",          iv:[0,1,3,5,6,8,10]},
];
const TYPE = Object.fromEntries(TYPES.map(x=>[x.id,x]));
const MAJ = [0,2,4,5,7,9,11];
const ROMAN = ["I","II","III","IV","V","VI","VII"];

function parse(n){ return {L:n[0], acc:n[1]==="#"?1:n[1]==="b"?-1:0}; }
function spellIv(tonic, iv){
  const {L,acc}=parse(tonic), li=LETTERS.indexOf(L), tpc=(NAT[li]+acc+12)%12;
  return iv.map((s,i)=>{ const l=LETTERS[(li+i)%7], pc=(tpc+s)%12;
    let a=((pc-NAT[LETTERS.indexOf(l)])%12+12)%12; if(a>6) a-=12; return {l,a,pc}; });
}
function baseIv(ty){ return ty.iv || TYPE[ty.from].iv; }
function spellType(tid, tonic, dir){
  const ty=TYPE[tid];
  if(ty.iv) return spellIv(tonic, (dir==="down" && ty.down) ? TYPE[ty.down].iv : ty.iv);
  const full=spellIv(tonic, TYPE[ty.from].iv); const s=ty.pick.map(i=>full[i]);
  if(ty.blue){ const f=s[3]; s.splice(3,0,{l:f.l,a:f.a-1,pc:(f.pc+11)%12}); }
  return s;
}
// Choose the most readable spelling of each tonic, then rank the 12 keys by accidentals (sharps first on ties)
const TONICS = {};
TYPES.forEach(ty=>{
  const rows=[];
  for(let pc=0;pc<12;pc++){
    const ni=NAT.indexOf(pc);
    const cands = ni>=0 ? [LETTERS[ni]] : [LETTERS[NAT.indexOf(pc-1)]+"#", LETTERS[NAT.indexOf(pc+1)]+"b"];
    let best=null;
    cands.forEach(c=>{ const sc=spellIv(c, baseIv(ty)); const score=sc.reduce((s,n)=>s+Math.abs(n.a)+(Math.abs(n.a)>1?100:0),0);
      const sharp=sc.some(n=>n.a>0)?0:1; if(!best||score<best.score) best={name:c,score,sharp}; });
    rows.push(best);
  }
  rows.sort((a,b)=>a.score-b.score || a.sharp-b.sharp);
  TONICS[ty.id]=rows.map(r=>r.name);
});
const accSym = a => a===1?"♯":a===-1?"♭":a===2?"𝄪":a===-2?"𝄫":"";
const nameIn = (n,not) => (not==="fr"?NAME_FR[n.l]:n.l)+accSym(n.a);
const noteName = n => nameIn(n, S.settings.notation);
const tonicNote = tonic => spellIv(tonic,[0])[0];
function scaleName(tid, tonic){
  const ty=TYPE[tid], lang=S.settings.lang;
  return noteName(tonicNote(tonic))+" "+(lang==="fr"?ty.fr:ty.en);
}
function sigText(tid, tonic){
  const ty=TYPE[tid];
  if(!ty.iv) return spellType(tid,tonic,"up").length+" "+t("notes");
  const sc=spellIv(tonic, ty.iv), n=sc.filter(x=>x.a!==0).length;
  return n ? n+" "+(sc.some(x=>x.a>0)?"♯":"♭") : t("noAcc");
}
function degLabel(n, root){
  const ld=(LETTERS.indexOf(n.l)-LETTERS.indexOf(root.l)+7)%7, semis=(n.pc-root.pc+12)%12;
  let d=semis-MAJ[ld]; if(d>6) d-=12; if(d<-6) d+=12;
  return (d<0?"♭".repeat(-d):d>0?"♯".repeat(d):"")+ROMAN[ld];
}

const CTYPES = [
  {id:"maj",   lvl:1, fr:"Majeur",          en:"Major",           sym:"",     iv:[0,4,7],    ls:[0,2,4]},
  {id:"min",   lvl:1, fr:"Mineur",          en:"Minor",           sym:"m",    iv:[0,3,7],    ls:[0,2,4]},

  {id:"maj7",  lvl:3, fr:"Majeur 7",        en:"Major 7",         sym:"maj7", iv:[0,4,7,11], ls:[0,2,4,6]},

  {id:"min7",  lvl:4, fr:"Mineur 7",        en:"Minor 7",         sym:"m7",   iv:[0,3,7,10], ls:[0,2,4,6]},
  {id:"hdim7", lvl:5, fr:"Demi-Diminué",    en:"Half-Diminished", sym:"ø7",   iv:[0,3,6,10], ls:[0,2,4,6]},
  {id:"dim7",  lvl:5, fr:"Diminué 7",       en:"Diminished 7",    sym:"°7",   iv:[0,3,6,9],  ls:[0,2,4,6]},
];
const CTYPE = Object.fromEntries(CTYPES.map(x=>[x.id,x]));
function spellIvL(tonic, iv, ls){
  const {L,acc}=parse(tonic), li=LETTERS.indexOf(L), tpc=(NAT[li]+acc+12)%12;
  return iv.map((s,i)=>{ const l=LETTERS[(li+ls[i])%7], pc=(tpc+s)%12;
    let a=((pc-NAT[LETTERS.indexOf(l)])%12+12)%12; if(a>6) a-=12; return {l,a,pc}; });
}
function spellChord(tid, root, inv){ const ty=CTYPE[tid], b=spellIvL(root, ty.iv, ty.ls); return b.slice(inv).concat(b.slice(0,inv)); }
const CROOTS = {};
CTYPES.forEach(ty=>{
  const rows=[];
  for(let pc=0;pc<12;pc++){
    const ni=NAT.indexOf(pc);
    const cands = ni>=0 ? [LETTERS[ni]] : [LETTERS[NAT.indexOf(pc-1)]+"#", LETTERS[NAT.indexOf(pc+1)]+"b"];
    let best=null;
    cands.forEach(c=>{ const sc=spellIvL(c, ty.iv, ty.ls); const score=sc.reduce((s,n)=>s+Math.abs(n.a)+(Math.abs(n.a)>1?100:0),0);
      const flat=sc[0].a<0?1:0; if(!best||score<best.score) best={name:c,score,flat}; });
    rows.push({...best,pc});
  }
  // white-key roots first (C D E F G A B), then black-key roots in keyboard order
  const white=pc=>NAT.includes(pc)?0:1;
  rows.sort((a,b)=>white(a.pc)-white(b.pc) || a.pc-b.pc);
  CROOTS[ty.id]=rows.map(r=>r.name);
});
function chordToneLabel(n, root){
  const ld=(LETTERS.indexOf(n.l)-LETTERS.indexOf(root.l)+7)%7, semis=(n.pc-root.pc+12)%12;
  if(ld===0) return t("rootLbl");
  let d=semis-MAJ[ld]; if(d>6) d-=12; if(d<-6) d+=12;
  return (d===-2?"𝄫":d<0?"♭".repeat(-d):d>0?"♯".repeat(d):"")+(ld+1);
}
const chordSym = (tid,root) => noteName(tonicNote(root))+(S.settings.notation==="fr"&&CTYPE[tid].sym?" ":"")+CTYPE[tid].sym;
const chordName = (tid,root) => noteName(tonicNote(root))+" "+(S.settings.lang==="fr"?CTYPE[tid].fr:CTYPE[tid].en);
const noteStr = n => n.l+(n.a>0?"#".repeat(n.a):"b".repeat(-n.a));
const symOf = (ct, n) => noteName(n)+(S.settings.notation==="fr"&&CTYPE[ct].sym?" ":"")+CTYPE[ct].sym;

// ---------- Harmony: chords of a key ----------
const HTYPES = [
  {id:"maj",  lvl:1, scale:"major", sev:false, fr:"Tonalités Majeures", en:"Major Keys"},
  {id:"min",  lvl:2, scale:"minor", sev:false, fr:"Tonalités Mineures", en:"Minor Keys"},

  {id:"min7", lvl:5, scale:"minor", sev:true,  fr:"Mineures · 7e",      en:"Minor Keys · 7ths"},
];
const HTYPE = Object.fromEntries(HTYPES.map(x=>[x.id,x]));
const CSUF = {dim:"°",aug:"+",maj7:"maj7",dom7:"7",min7:"7",hdim7:"ø7",dim7:"°7"};
function hChord(scale, key, deg, sev){
  const sc=spellIv(key, TYPE[scale].iv);
  const notes=[0,2,4].concat(sev?[6]:[]).map(o=>sc[(deg+o)%7]);

// close voicing of a chord (spelled notes, inversion) with its bass at midi `bass`
function voiceAt(notes, inv, bass){
  const ord=notes.slice(inv).concat(notes.slice(0,inv)); let prev=bass-1;
  return ord.map((n,i)=>{ let m = i===0 ? bass : prev+1; while(((m%12)+12)%12!==n.pc) m++; prev=m; return m; });
}
function progSteps(pid, key, vl){
  const pr=PROG[pid]; let prevV=null;
  return pr.deg.map(d=>{
    const ch=hChord(pr.scale,key,d,pr.sev); let best=null;
    if(!vl || !prevV){ let b=48+ch.root.pc; if(b<52) b+=12; best={inv:0,v:voiceAt(ch.notes,0,b)}; }
    else {
      for(let inv=0;inv<ch.notes.length;inv++){
        const bpc=ch.notes[inv].pc;
        for(let b=prevV[0]-7;b<=prevV[0]+7;b++){ if(((b%12)+12)%12!==bpc) continue;
          const v=voiceAt(ch.notes,inv,b), a=v.slice().sort((x,y)=>x-y), q=prevV.slice().sort((x,y)=>x-y);
          const cost=a.reduce((sum,m,i)=>sum+Math.abs(m-q[Math.min(i,q.length-1)]),0)+Math.abs(b-prevV[0])*.1;
          if(!best||cost<best.cost) best={inv,v,cost}; }

    }

    return {...ch, inv:best.inv, voicing:best.v, bassPc:ch.notes[best.inv].pc};
  });
}

let ctx=null, master=null, micMuteUntil=0;
function audio(){
  if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    ctx=new AC(); const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
    master=ctx.createGain(); master.gain.value=.55; master.connect(lp); lp.connect(ctx.destination); }
  if(ctx.state==="suspended") ctx.resume();
  return ctx;
}
function tone(midi, when=0, dur=.6, vol=.28){
  const c=audio(); if(!c) return;
  const t0=c.currentTime+when, f=440*Math.pow(2,(midi-69)/12);
  [["triangle",1,vol],["sine",2,vol*.25]].forEach(([type,mul,v])=>{
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f*mul;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.012); g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.05); });
  micMuteUntil=Math.max(micMuteUntil, performance.now()+(when+dur)*1000+180);
}

let phase="idle", cur=null, seq=[], found=[], played=[], idx=0, errors=0, startT=0, deadline=0, combo=0, raf=0, advanceTimer=0, lastId=null;

  const cand = p.length>1 ? p.filter(x=>mkey(x)!==lastId) : p;
  const w=cand.map(x=>6-mastI(x)); let r=Math.random()*w.reduce((a,b)=>a+b,0);

let micOn=false;
$("micBtn").addEventListener("click", async ()=>{
  if(micOn) return; const c=audio(); if(!c) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=c.createMediaStreamSource(stream), an=c.createAnalyser(); an.fftSize=2048; src.connect(an);
    const buf=new Float32Array(an.fftSize); let cand=null, count=0, lastEmit=null;
    micOn=true; $("micBtn").classList.add("on"); $("micBtn").classList.remove("err"); $("micTxt").textContent=t("micOn"); notice("");
    setInterval(()=>{
      an.getFloatTimeDomainData(buf); const f=autoCorrelate(buf,c.sampleRate);
      if(f<0){ cand=null; count=0; lastEmit=null; return; }
      if(performance.now()<micMuteUntil) return;
      const m=Math.round(69+12*Math.log2(f/440));
      if(m===cand) count++; else { cand=m; count=1; }
      if(count===3 && m%12!==lastEmit){ lastEmit=m%12; flashKey(m,"k-hit",150); noteIn(m); }
    },25);
  }catch(err){ $("micBtn").classList.add("err"); $("micTxt").textContent=t("micBlocked"); notice(t("blocked")); }
});
function autoCorrelate(buf,sr){
  let SIZE=buf.length, rms=0; for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/SIZE);
  if(rms<0.012) return -1;
  let r1=0, r2=SIZE-1; const th=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<th){ r1=i; break; }
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<th){ r2=SIZE-i; break; }
  const b=buf.slice(r1,r2); SIZE=b.length; if(SIZE<64) return -1;
  const c=new Float32Array(SIZE);
  for(let i=0;i<SIZE;i++){ let s=0; for(let j=0;j<SIZE-i;j++) s+=b[j]*b[j+i]; c[i]=s; }
  let d=0; while(d<SIZE-1 && c[d]>c[d+1]) d++;
  let maxv=-1, maxp=-1; for(let i=d;i<SIZE;i++) if(c[i]>maxv){ maxv=c[i]; maxp=i; }
  if(maxp<1||maxp>=SIZE-1) return -1;
  const x1=c[maxp-1], x2=c[maxp], x3=c[maxp+1], a=(x1+x3-2*x2)/2, bb=(x3-x1)/2;
  const T0=a?maxp-bb/(2*a):maxp, f=sr/T0;
  return (f<55||f>1600)?-1:f;
}

  }
  if(i===1){
    const id="ah1"; let o=svgHead(id);
    // input sources
    const chip=(y,label,icon)=>'<rect x="10" y="'+y+'" width="88" height="32" rx="16" class="s-chip"/>'+icon+txt(46,y+21,"s-t",12,label);
    const pianoIcon=y=>'<rect x="22" y="'+(y+9)+'" width="16" height="14" rx="2" class="s-icon"/><path class="s-icon" d="M27.3 '+(y+9)+' v9 M32.6 '+(y+9)+' v9"/>';
    const micIcon=y=>'<rect x="26" y="'+(y+7)+'" width="8" height="12" rx="4" class="s-icon"/><path class="s-icon" d="M22 '+(y+16)+' a8 8 0 0 0 16 0 M30 '+(y+24)+' v3"/>';
    const scrIcon=y=>'<rect x="21" y="'+(y+8)+'" width="18" height="13" rx="2" class="s-icon"/><path class="s-icon" d="M26 '+(y+25)+' h8"/>';
    o+=chip(84,"MIDI",pianoIcon(84))+chip(120,L.mic,micIcon(120))+chip(156,L.screen,scrIcon(156));
    // slots
    const sx=132, sw=26, gap=2.5;
    sc.forEach((n,j)=>{
      const x=sx+j*(sw+gap), cls=j<3?"s-slot-ok":j===3?"s-slot-cur":"s-slot";
      o+='<rect x="'+x+'" y="14" width="'+sw+'" height="46" rx="5" class="'+cls+'"/>';
      o+=txt(x+sw/2,28,"s-m",8.5,j===7?"I":degLabel(n,sc[0]),"middle");
      if(j<3) o+=txt(x+sw/2,49,"s-gt",S.settings.notation==="fr"?9.5:12,noteName(n),"middle");
    });
    o+=miniKeys(132,104,224,78,{2:"s-hg",4:"s-hg",6:"s-hg"});
    o+=arrow(id,"M100 100 C 116 100, 118 128, 128 128")+arrow(id,"M100 136 L 128 136")+arrow(id,"M100 172 C 116 172, 118 146, 128 146");
    o+=arrow(id,"M206 100 L 206 68");
    return o+'</svg>';
  }
  if(i===2){
    const id="ah2"; const hl={}; [2,4,6,7,9,11,1].forEach(x=>hl[x]="s-hr"); hl[2]="s-hg"; hl[4]="s-hg";
    return svgHead(id)
      +'<rect x="16" y="22" width="150" height="9" rx="4.5" class="s-track"/><rect x="16" y="22" width="8" height="9" rx="4" class="s-badfill"/>'
      +txt(172,31,"s-bad",11,"0 s")
      +arrow(id,"M91 40 L 91 70")
      +miniKeys(16,78,150,92,hl)
      +arrow(id,"M174 124 L 206 124")
      +'<rect x="214" y="84" width="134" height="36" rx="9" class="s-btn-good"/>'+txt(281,107,"s-on",13,t("knew"),"middle")
      +'<rect x="214" y="130" width="134" height="36" rx="9" class="s-btn"/>'+txt(281,153,"s-t",13,t("review"),"middle")
      +'</svg>';
  }
  // step 4
  const id="ah3";
  const pips=(x,y,n)=>[0,1,2,3,4].map(k=>'<rect x="'+(x+k*15)+'" y="'+y+'" width="12" height="5" rx="2" class="'+(k<n?"s-pipg":"s-pip")+'"/>').join("");
  return svgHead(id)
    +'<rect x="12" y="44" width="100" height="92" rx="10" class="s-card"/>'
    +txt(24,72,"s-name",17,noteName(tonicNote("C")))+txt(24,90,"s-m",9.5,sigText("major","C"))+pips(24,104,3)
    +txt(62,156,"s-m",11,"3 / 5","middle")
    +arrow(id,"M118 90 L 146 90")
    +'<rect x="152" y="44" width="100" height="92" rx="10" class="s-tile-new"/>'
    +txt(164,72,"s-name",17,noteName(tonicNote("G")))+txt(164,90,"s-m",9.5,sigText("major","G"))+pips(164,104,0)
    +txt(202,156,"s-m",11,L.unlocked,"middle")
    +'<path class="s-spark" d="M248 34 l6 -8 M258 44 l10 -2 M236 30 l0 -10"/>'
    +arrow(id,"M258 90 L 280 90")
    +'<rect x="286" y="58" width="62" height="40" rx="9" class="s-ink"/>'+txt(317,84,"s-onink",15,t("lvlShort")+"2","middle")
    +'<rect x="286" y="106" width="62" height="6" rx="3" class="s-pip"/><rect x="286" y="106" width="22" height="6" rx="3" class="s-fill"/>'
    +txt(317,132,"s-m",9.5,L.types,"middle")
    +'</svg>';
}
function renderTut(){
  const steps=t("tut"), n=steps.length;
  $("helpTitle").textContent=t("helpTitle");
  $("helpX").setAttribute("aria-label",t("close"));
  $("tutFig").innerHTML=tutSvg(tutI);
  $("tutStep").textContent=t("stepOf")(tutI+1,n);
  $("tutH").textContent=steps[tutI].h; $("tutP").textContent=steps[tutI].p;
  const tx=$("tutStep").parentElement; tx.style.animation="none"; void tx.offsetWidth; tx.style.animation="";
  $("tutPrev").disabled=tutI===0; $("tutPrev").setAttribute("aria-label",t("tutPrev"));
  $("tutNextTxt").textContent= tutI===n-1 ? t("helpOk") : t("tutNext");
  const dots=$("tutDots"); dots.innerHTML="";
  steps.forEach((st,k)=>{ const b=document.createElement("button"); b.type="button"; b.setAttribute("aria-label",t("stepOf")(k+1,n));
    if(k===tutI) b.setAttribute("aria-current","step"); b.onclick=()=>{ tutI=k; renderTut(); }; dots.appendChild(b); });
}
function tutGo(d){ const n=t("tut").length; if(tutI+d>=n){ closeHelp(); return; } tutI=Math.max(0,tutI+d); renderTut(); }
function openHelp(){
  if(helpOpen) return; helpOpen=true; lastFocus=document.activeElement; tutI=0;
  if(phase==="listening"){ cancelAnimationFrame(raf); pausedLeft = deadline ? Math.max(0,deadline-performance.now()) : 0; }
  renderTut(); $("helpModal").hidden=false; $("tutNext").focus();
}
function closeHelp(){
  if(!helpOpen) return; helpOpen=false; $("helpModal").hidden=true;
  if(phase==="listening"){ if(deadline) deadline=performance.now()+pausedLeft; raf=requestAnimationFrame(tick); }
  try{ lastFocus&&lastFocus.focus(); }catch(e){}
}
$("helpBtn").addEventListener("click",openHelp);
$("helpX").addEventListener("click",closeHelp);
$("helpBg").addEventListener("click",closeHelp);
$("tutNext").addEventListener("click",()=>tutGo(1));
$("tutPrev").addEventListener("click",()=>tutGo(-1));
let swipeX=null;
$("helpBody").addEventListener("pointerdown",e=>{ swipeX=e.clientX; });
$("helpBody").addEventListener("pointerup",e=>{ if(swipeX==null) return; const dx=e.clientX-swipeX; swipeX=null;
  if(Math.abs(dx)>50){ if(dx<0 && tutI<t("tut").length-1) tutGo(1); else if(dx>0) tutGo(-1); } });

// ---------- Boot ----------
if(narrowMQ.matches){ $("mapPanel").open=false; $("setPanel").open=false; }
applyStatic(); buildKeyboard(); renderSettings(); render(); renderDaily();
if(firstVisit){ save(); openHelp(); }
})();
</script>
