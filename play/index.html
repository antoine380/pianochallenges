<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<style>html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0}img{max-width:100%}</style>
<title>Play · Piano Challenges</title>
<style>
@font-face{font-family:"Fredoka";font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/fredoka-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/fredoka-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:500;font-display:swap;src:url(../assets/fonts/nunito-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:800;font-display:swap;src:url(../assets/fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Bravura";font-style:normal;font-weight:400;font-display:block;src:url(../assets/fonts/bravura.woff2) format("woff2")}
/* Layout: ROLI-style. Home = cream page, light oversized headline, colored tiles each holding a dark "tablet" with a 3D cascade.
   Play = dark full-bleed stage; notes fall in perspective as extruded pills onto a dark keyboard whose keys light in the note's color. */
:root{
  --paper:#eceef2; --paper-2:#ffffff; --ink:#161920; --muted:#5b6271; --rule:#d4d8e0; --accent:#b8740f;
  --coral:#f26a5e; --violet:#7a5cf5; --cyan:#3ab8c8; --sun:#e7c344; --mint:#49c08a;
  --stage:#15122e; --stage-2:#2d2759; --key:#4b438f; --glass:#f4f1ff; --glass-muted:#9b98a8;
  --good:#49c08a; --warn:#e7c344; --bad:#f25c6e;
  --f:'Fredoka','Nunito','Avenir Next Rounded',system-ui,sans-serif;
  --f-body:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-mono:'Nunito','Avenir Next',system-ui,sans-serif;
  --gutter-l:max(20px, env(safe-area-inset-left, 0px));
  --gutter-r:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111318;--paper-2:#191c23;--ink:#e8eaf0;--muted:#949bab;--rule:#2b303b;--accent:#eaa63c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111318;--paper-2:#191c23;--ink:#e8eaf0;--muted:#949bab;--rule:#2b303b;--accent:#eaa63c;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none} /* no pull-to-refresh or page bounce; the song list scrolls on its own */
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Home ---------- */
.home{overflow-y:auto;overscroll-behavior:contain;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:18px 40px}
.home-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f);font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand-keys{display:flex;gap:3px;padding:6px 7px;background:var(--ink);border-radius:8px}
.brand-keys i{width:6px;height:18px;border-radius:1px 1px 3px 3px;display:block}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule);font-size:14px;color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.pill.on{color:var(--ink)} .pill.on .dot{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.btn{padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--f);font-weight:700;font-size:14px}
@media (hover:hover) and (pointer:fine){.btn:hover{opacity:.9}}
.btn.light{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule)}
.hello h1{font-family:var(--f);font-weight:800;font-size:clamp(30px,4.4vw,52px);letter-spacing:-.03em;line-height:1;margin:0;text-wrap:balance;max-width:15ch}
.hello p{margin:10px 0 0;color:var(--muted);max-width:60ch;line-height:1.5;font-size:clamp(15px,1.3vw,17px)}
.sec-h{display:flex;align-items:baseline;gap:14px;margin:0 0 16px}
.sec-h h2{font-family:var(--f);font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
.sec-h span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;text-align:left;border-radius:26px;overflow:hidden;padding:18px 18px 20px;gap:14px;color:#fff;transition:transform .18s;position:relative}
@media (hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-3px)}}
.tab{aspect-ratio:16/10;max-width:100%;border-radius:12px;background:#111016;box-shadow:0 10px 26px #0005,inset 0 0 0 3px #26242e;position:relative;overflow:hidden;perspective:420px}
.tab .floor{position:absolute;inset:0;transform-origin:50% 100%;transform:rotateX(52deg) translateY(-8%);background:repeating-linear-gradient(90deg,transparent 0 calc(100%/14 - 1px),#ffffff18 0 calc(100%/14))}
.tab .floor i{position:absolute;border-radius:5px;display:block;box-shadow:0 0 10px currentColor,inset 0 -4px 0 #0004}
.tab .mini{position:absolute;left:4%;right:4%;bottom:0;height:22%;display:flex;gap:2px}
.tab .mini i{flex:1;background:#2b2a31;border-radius:0 0 3px 3px;display:block}
.tab .mini i.lit{box-shadow:inset 0 -6px 0 currentColor}
.tab .big{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.02em;color:#fff;text-shadow:0 0 24px currentColor}
.tile-body{display:flex;flex-direction:column;gap:4px}
.tile .lvl{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.tile h3{margin:0;font-family:var(--f);font-weight:800;font-size:21px;letter-spacing:-.015em;line-height:1.15}
.tile .meta{display:flex;justify-content:space-between;align-items:center;opacity:.9;font-size:14px;gap:8px;margin-top:4px}
.stars{letter-spacing:2px;font-size:15px}
.stars .off{opacity:.3}
.foot{color:var(--muted);font-size:13px;line-height:1.55;max-width:80ch;border-top:1px solid var(--rule);padding-top:18px}

/* ---------- Play (dark stage) ---------- */
#play{background:var(--stage);color:var(--glass)}
.bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:8px;background:var(--stage)}
.back{width:40px;height:40px;border-radius:50%;background:var(--stage-2);display:grid;place-items:center;color:var(--glass);font-size:22px;line-height:1;flex:none}
.ttl{display:flex;flex-direction:column;min-width:0;max-width:34vw}
.ttl b{font-family:var(--f);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--glass-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:1;min-width:60px;height:4px;border-radius:2px;background:var(--stage-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--violet);border-radius:2px}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:52px}
.stat small{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--glass-muted)}
.stat b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.tools{display:flex;gap:2px;align-items:flex-start;flex-wrap:wrap;margin-left:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 7px;border-radius:12px;min-width:54px;color:var(--glass-muted);font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{color:var(--glass);background:var(--stage-2)}
.tool.speed b{font-family:var(--f-mono);font-size:14px;font-weight:700;height:22px;display:grid;place-items:center;color:inherit}
.tool.speed[aria-pressed="true"] b{color:var(--sun)}
.lives{color:var(--bad);font-size:18px;letter-spacing:3px}
.lives .off{color:var(--stage-2)}

.stagewrap{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:max(12px, env(safe-area-inset-bottom, 0px))}
.stage{position:relative;flex:1;min-height:120px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kbd{position:relative;height:clamp(120px,27vh,230px);touch-action:none;flex-shrink:0;background:#221d47;border-radius:0 0 18px 18px;padding:0 6px 8px;box-shadow:0 14px 30px #0008}
.kbd::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:2px;background:#9d8bff;box-shadow:0 0 14px 1px #9d8bff;z-index:3}
.key{position:absolute;top:4px;border-radius:0 0 8px 8px;--kc:#fff;transition:box-shadow 140ms ease,background 140ms ease}
.key.w{height:calc(100% - 12px);background:#4b438f;border:0;margin-left:1.5px;box-shadow:inset 0 -7px 0 #2f2966;border-radius:0 0 10px 10px}
.key.b{height:60%;z-index:2;background:#1e1a42;border:0;border-radius:0 0 7px 7px;box-shadow:inset 0 -5px 0 rgba(255,255,255,.08),0 4px 8px -2px rgba(10,6,30,.45)}
.key .lbl{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;font-weight:800;color:#d6d1ff;pointer-events:none}
.key.b .lbl{color:#a9a2e0;font-size:9px;bottom:7px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.key .fg{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#15131c;color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:700;display:none;place-items:center;pointer-events:none}
.key.b .fg{width:18px;height:18px;font-size:10px}
.key.target .fg{display:grid}
.key.target{background:var(--kc);box-shadow:0 0 22px var(--kc),inset 0 -5px 0 #0003;border-color:transparent}
.key.target .lbl,.key.down .lbl{color:#15131c}
.key.down{background:color-mix(in srgb,var(--kc) 70%,#fff);box-shadow:0 0 30px var(--kc),inset 0 4px 8px #0005;border-color:transparent}
.key.wrong{background:var(--bad)!important;box-shadow:0 0 20px var(--bad)!important}
.key.down,.key.wrong{transition:none}
/* lesson mode (Premiers pas, P08): one phrase, wait mode, no tools; pale labels (aid 1), the right key blinks after a wrong note */
body.lesson .bar .back,body.lesson .tools,body.lesson #stStreak,body.lesson .stat{display:none!important}
body.lesson.lbl-pale .key .lbl{opacity:.35}
.key.blink{animation:lsBlink .3s ease-in-out 3 alternate}
@keyframes lsBlink{to{background:var(--kc);box-shadow:0 0 26px var(--kc)}}
@media (prefers-reduced-motion:reduce){.key.blink{animation:none;background:var(--kc)}} /* a key lights at once; only the release fades */

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#15122eb8;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:5;padding:16px;overflow:auto}
.ocard{background:var(--stage-2);border-radius:26px;padding:26px 30px;max-width:470px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.ocard .lvl{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--glass-muted)}
.ocard h2{font-family:var(--f);font-weight:800;font-size:28px;margin:0;letter-spacing:-.025em;text-wrap:balance}
.ocard p{margin:0;color:var(--glass-muted);line-height:1.5}
.ocard .src{font-size:12px;line-height:1.45;opacity:.9}.ocard .src a{color:inherit}@media (max-height:720px){.ocard .src .ot{display:none}}
.ocard .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.ocard .btn{background:var(--glass);color:var(--stage)}
.ocard .btn.light{background:transparent;color:var(--glass);border:1px solid #3a3944}
.big-stars{font-size:44px;color:var(--sun);letter-spacing:6px}
.big-stars .off{color:#2c2b34} .big-stars span{display:inline-block}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.res div{background:var(--stage);border-radius:14px;padding:12px 4px}
.res b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.res small{font-size:11px;color:var(--glass-muted)}
.hint{font-size:12px;color:var(--glass-muted)}
.seg{display:inline-flex;gap:4px;justify-content:center;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;border:1px solid #3a3944;font-size:14px;color:var(--glass-muted)}
.seg button[aria-pressed="true"]{background:var(--glass);color:var(--stage);border-color:var(--glass)}
/* sheet view: the song written in bars on a paper card, a cursor follows the playback */
.sheet{position:absolute;inset:8px 0 10px;background:#f7f6ff;color:#221d47;border-radius:18px;box-shadow:0 10px 30px #0006;display:flex;flex-direction:column;justify-content:center;padding:8px 14px;overflow:hidden;z-index:1}
.sheet-in{position:relative;display:flex;flex-direction:column;gap:6px}
.sheet .sys svg{display:block}
.sheet .sys+.sys{opacity:.6}
.sheet-cur{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:#7a5bf5;box-shadow:0 0 10px #7a5bf5aa;pointer-events:none;will-change:transform}
.sheet-msg{position:absolute;top:6px;left:0;right:0;text-align:center;font-family:var(--f);font-weight:700;font-size:14px;color:#5b5486;pointer-events:none}
.sheet-msg.big{top:50%;transform:translateY(-50%);font-size:84px;color:#7a5bf5;opacity:.85}
@media (max-width:560px){.res{grid-template-columns:repeat(2,1fr)} .stat b{font-size:16px} .tool{min-width:46px} .ttl{max-width:40vw}}
@media (prefers-reduced-motion:reduce){.tile,.key{transition:none}}
</style>
</head>
<body>
<div id="app">
  <section class="screen home" id="home">
    <div class="home-inner">
      <header class="top" id="topBar">
        <div class="brand" id="brand">
          <span class="brand-keys" aria-hidden="true"><i style="background:#f26a5e"></i><i style="background:#f0a04a"></i><i style="background:#e7c344"></i><i style="background:#49c08a"></i><i style="background:#3ab8c8"></i><i style="background:#7a5cf5"></i></span>
          Clavio
        </div>
        <div class="top-right">
          <span class="pill" id="midiPill"><span class="dot"></span><span id="midiText" data-i="midiScreen"></span></span>
          <button class="btn light" id="midiBtn" data-i="midiConnect"></button>
          <span class="pill"><span class="stars" style="color:var(--sun)">★</span><span class="mono" id="starTotal">0</span></span>
        </div>
      </header>
      <div class="hello">
        <h1 id="heroT" data-i="heroT"></h1>
        <p id="heroP" data-i="heroP"></p>
      </div>
      <section id="secSongs">
        <div class="sec-h"><h2 data-i="songsH"></h2><span data-i="songsSub"></span></div>
        <div class="grid" id="songGrid"></div>
      </section>
      <section id="secGames">
        <div class="sec-h"><h2 data-i="gamesH"></h2><span data-i="gamesSub"></span></div>
        <div class="grid" id="gameGrid"></div>
      </section>
      <p class="foot" id="foot" data-i="foot"></p>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="bar">
      <button class="back" data-home aria-label="Retour" data-i-aria="back">‹</button>
      <div class="ttl"><b id="sTitle">—</b><small id="sSub">—</small></div>
      <div class="prog" id="progWrap"><i id="sProg"></i></div>
      <div class="stat" id="stLives" hidden><small data-i="lives"></small><span class="lives" id="gLives"></span></div>
      <div class="stat" id="stTime" hidden><small data-i="time"></small><b id="gTime">60</b></div>
      <div class="stat" id="stStreak"><small data-i="streak"></small><b id="sStreak">0</b></div>
      <div class="stat"><small data-i="score"></small><b id="sScore">0</b></div>
      <div class="tools">
        <button class="tool speed" id="tSpeed" aria-pressed="false"><b id="speedLbl">100</b><span data-i="speed"></span></button>
        <button class="tool" id="tNames" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg><span data-i="names"></span></button>
        <button class="tool" id="tFing" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6.5a1.5 1.5 0 0 1 3 0V13M17 12.5V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-1.5a6 6 0 0 1-5-2.7L4 14.5a1.6 1.6 0 0 1 2.6-1.9L8 14"/></svg><span data-i="fing"></span></button>
        <button class="tool song-only" id="tWait" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/></svg><span data-i="wait"></span></button>
        <button class="tool song-only" id="tSheet" aria-pressed="false" hidden><svg viewBox="0 0 24 24"><path d="M3 7h18M3 11h18M3 15h18"/><ellipse cx="9" cy="16.5" rx="2.4" ry="1.8" transform="rotate(-20 9 16.5)"/><path d="M11.2 16V5"/></svg><span data-i="sheet"></span></button>
        <button class="tool song-only" id="tListen" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg><span data-i="listen"></span></button>
        <button class="tool song-only" id="tMetro" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 3h8l3 18H5z"/><path d="M12 15L18 5"/></svg><span data-i="metro"></span></button>
        <button class="tool game-only" id="tHint" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span data-i="hint"></span></button>
        <button class="tool" id="restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg><span data-i="replay"></span></button>
      </div>
    </div>
    <div class="stagewrap">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn"></div><div class="sheet-msg" id="sheetMsg"></div></div>
        <div class="overlay" id="ov" hidden><div class="ocard" id="ovCard"></div></div>
      </div>
      <div class="kbd" id="kbd" aria-label="Clavier" data-i-aria="kbd"></div>
    </div>
  </section>
</div>

<script src="../assets/js/staff.js"></script>
<script src="../assets/js/songs-data.js"></script>
<script src="../assets/js/song-import.js"></script>
<script>
(() => {
/* ================= Language ================= */
// The hash carries the view and the language: #songs&lang=en, #games&lang=fr, #game=runner&lang=en. Alone, the browser language decides.
const HASH=(location.hash||'#all').slice(1).split('&');
const LANG=(HASH.find(x=>x.startsWith('lang='))||'lang='+((navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en')).slice(5)==='fr'?'fr':'en';
document.documentElement.lang=LANG;
const T={
fr:{midiScreen:"Clavier à l'écran",midiConnect:"Connecter un clavier MIDI",midiHost:"Notes reçues de Piano Challenges",midiNone:"MIDI web indisponible ici",midiNo:"Aucun clavier MIDI détecté",midiDenied:"Accès MIDI refusé",midiLbl:"MIDI : ",
 heroT:"Il y a une raison pour qu'on dise « jouer » du piano",heroP:"Branche n'importe quel clavier MIDI, ou joue sur celui de l'écran. Les notes tombent sur les touches ; à toi de les attraper au bon moment.",

const HUE=[352,10,28,37,46,146,170,194,211,228,250,271]; // same note colours as the host keyboard (Do red … Si violet)
const col=(m,l=62,a=1)=>`hsla(${HUE[((m%12)+12)%12]},86%,${l}%,${a})`;
const pc=m=>((m%12)+12)%12;
const isBlack=m=>[1,3,6,8,10].includes(pc(m));
let LOW=60, HIGH=83; // C4..B5; a two-hand song widens it down to C3 (setRange)
const toMidi=n=>{const t=n.match(/^([A-G])(#?)(\d)$/);return 12*(+t[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[t[1]]+(t[2]?1:0)};
const parse=(s,fing)=>{let b=0;const out=[];for(const tok of s.trim().split(/\s+/)){const[n,d]=tok.split(':');const dur=parseFloat(d);if(n!=='R')out.push({m:toMidi(n),s:b,d:dur,f:fing[n]||0});b+=dur}return out};

// Songs come from the shared catalogue (assets/js/songs-data.js, C6): one entry per song, one variant per arrangement (Easy / Medium / Advanced)
const PS=window.PC_SONG;
const SONGS=PS.list.map(d=>{const s={id:d.id,data:d,title:d.t[LANG==='fr'?0:1],bpm:d.bpm,meter:d.m,pickup:d.p,col:d.k,arrs:PS.arrs(d)};
  s.by=d.by==='trad'?(tr('byFrom')[d.from]||tr('trad')):d.by;return s});
// fingering of the melody: the song's own map, or a five-finger position when the melody fits in five white keys
function fingOf(d){if(d.f)return n=>d.f[n.name]||0;const mel=PS.parseSeq(d.mel).notes,W=[0,2,4,5,7,9,11],wi=m=>Math.floor(m/12)*7+W.indexOf(pc(m));
  if(mel.some(n=>isBlack(n.m)))return()=>0;const lo=Math.min(...mel.map(n=>wi(n.m))),hi=Math.max(...mel.map(n=>wi(n.m)));return hi-lo<=4?n=>wi(n.m)-lo+1:()=>0}
function variant(s,lv){if(s.imp)return impVariant(s,lv);const a=s.arrs.find(x=>x.lv===lv)||s.arrs[0],fo=fingOf(s.data);
  const notes=PS.build(s.data,a.lv).map(n=>({m:n.m,s:n.s,d:n.d,h:n.h,f:n.h===1?fo(n):0}));
  return {...s,id:a.key,level:a.lv,hands:a.hands,notes,end:Math.max(...notes.map(n=>n.s+n.d)),base:s}}
SONGS.forEach(s=>{s.v0=variant(s,s.arrs[0].lv)});

// aid 1 = pale names, aid 2 = no names, no fingers, the next key lights only after 3 s; another octave counts. Reports to the host page.
const LS=HASH.includes('lesson=1')?{aid:+((HASH.find(x=>x.startsWith('aid='))||'aid=0').slice(4))||0,listen:HASH.includes('listen=1'),err:0,errAt:null,since:0,quiet:false}:null;

if(LS){document.body.classList.add('lesson');if(LS.aid>=1)document.body.classList.add('lbl-pale');const _v=variant;
  variant=function(s,lv){const v=_v(s,lv);if(s.id==='lune'){v.notes=v.notes.slice(0,11);v.end=Math.max(...v.notes.map(n=>n.s+n.d))}return v};
  const L=SONGS.find(x=>x.id==='lune');if(L)L.v0=variant(L,L.arrs[0].lv)}

/* ================= Audio ================= */
let AC=null, master=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;
    const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination)}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();return AC}
const voices=new Map();
const lsTone=(m,sec)=>{try{if(LS&&window.parent!==window&&window.parent.__ppTone){window.parent.__ppTone(m,sec);return true}}catch(e){}return false};
function soundOn(m,vel=.8){
  if(LS){if(LS.quiet)return;if(lsTone(m,.7))return}
  const ac=audio();if(!ac)return;soundOff(m,true);
  const f=440*2**((m-69)/12),t=ac.currentTime,g=ac.createGain(),lp=ac.createBiquadFilter();
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(f*9,10000),t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*2.2,700),t+1.4);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.34*vel,t+.006);
  g.gain.exponentialRampToValueAtTime(.11*vel,t+.4);g.gain.exponentialRampToValueAtTime(.0006,t+3.4);
  lp.connect(g);g.connect(master);
  const oscs=[[1,'triangle',1],[2,'sine',.32],[3,'sine',.1],[1.003,'sine',.35]].map(([mul,type,amp])=>{
    const o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f*mul;a.gain.value=amp;o.connect(a);a.connect(lp);o.start(t);o.stop(t+3.5);return o});
  voices.set(m,{g,oscs});
}
function soundOff(m,quick){
  const v=voices.get(m);if(!v||!AC)return;voices.delete(m);const t=AC.currentTime;
  v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(Math.max(v.g.gain.value,.0001),t);
  v.g.gain.setTargetAtTime(.0001,t,quick?.01:.14);v.oscs.forEach(o=>{try{o.stop(t+(quick?.06:.9))}catch(e){}});
}
function playNote(m,sec=.6,vel=.75){soundOn(m,vel);const k=keyEls.get(m);k?.classList.add('down');setTimeout(()=>{soundOff(m);if(!held.has(m))k?.classList.remove('down')},sec*1000)}
function blip(freq,dur=.08,type='square',vol=.08,slide){
  const ac=audio();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
const fanfare=()=>[0,.12,.24].forEach((d,i)=>setTimeout(()=>blip([660,880,1320][i],.18,'triangle',.08),d*1000));

/* ================= Keyboard ================= */
const WH=[];
function lane(m){if(m<LOW||m>HIGH)return null;const ww=1/WH.length;
  if(!isBlack(m))return{x:WH.indexOf(m)*ww,w:ww};const bw=ww*.6;return{x:(WH.indexOf(m-1)+1)*ww-bw/2,w:bw}}
const kbd=document.getElementById('kbd'),keyEls=new Map();
let showNames=true,showFing=true;
function buildKeys(){WH.length=0;for(let m=LOW;m<=HIGH;m++)if(!isBlack(m))WH.push(m);kbd.innerHTML='';keyEls.clear();
for(let m=LOW;m<=HIGH;m++){const L=lane(m),k=document.createElement('div');
  k.className='key '+(isBlack(m)?'b':'w');
  k.style.left=`calc(6px + (100% - 12px) * ${L.x})`;k.style.width=`calc((100% - 12px) * ${L.w} - 2px)`;
  k.style.setProperty('--kc',col(m,isBlack(m)?56:62));k.dataset.m=m;
  k.innerHTML='<span class="lbl"></span><span class="fg"></span>';kbd.appendChild(k);keyEls.set(m,k)}}
buildKeys();
// a two-hand arrangement needs the octave below middle C: the keyboard widens to C3..B5, and back to C4..B5 for the rest
function setRange(lo,hi){if(lo===LOW&&hi===HIGH)return;LOW=lo;HIGH=hi;buildKeys();labelKeys();lastTargets='x';SV.sig=''}
const FLATS=LANG==='fr'?['','Ré♭','','Mi♭','','','Sol♭','','La♭','','Si♭','']:['','D♭','','E♭','','','G♭','','A♭','','B♭',''];
function labelKeys(){keyEls.forEach((k,m)=>{k.firstChild.textContent=!showNames?(pc(m)===0?NAMES[0]+(Math.floor(m/12)-(LANG==='fr'?2:1)):''):(isBlack(m)?FLATS[pc(m)]:NAMES[pc(m)])})}
labelKeys();
let lastTargets='';
function setTargets(list){ // [{m,f}]
  const key=list.map(o=>o.m+':'+(showFing?o.f||0:0)).join(',');if(key===lastTargets)return;lastTargets=key;
  keyEls.forEach((k,m)=>{const o=list.find(x=>x.m===m);k.classList.toggle('target',!!o);k.lastChild.textContent=o&&showFing&&o.f?o.f:'';if(!(o&&showFing&&o.f))k.lastChild.style.display='none';else k.lastChild.style.display='grid'})}

/* ================= Input ================= */
const held=new Set();
function noteOn(m,vel=.8){if(held.has(m))return;held.add(m);soundOn(m,vel);if(LS)lsPost({ev:'press',m});keyEls.get(m)?.classList.add('down');
  if(screen==='play'&&ov.hidden){if(mode==='song')songPress(m);else GAME[mode]?.press?.(m)}}
function noteOff(m){if(!held.has(m))return;held.delete(m);soundOff(m);keyEls.get(m)?.classList.remove('down')}
const ptr=new Map();
kbd.addEventListener('pointerdown',e=>{const k=e.target.closest('.key');if(!k)return;e.preventDefault();
  const m=+k.dataset.m;ptr.set(e.pointerId,m);
  const rect=k.getBoundingClientRect();const vel=.45+.55*Math.min(1,(e.clientY-rect.top)/rect.height);noteOn(m,vel)});
const up=e=>{const m=ptr.get(e.pointerId);if(m!=null){ptr.delete(e.pointerId);noteOff(m)}};
['pointerup','pointercancel','pointerleave'].forEach(t=>kbd.addEventListener(t,up));
const CODE={KeyA:60,KeyW:61,KeyS:62,KeyE:63,KeyD:64,KeyF:65,KeyT:66,KeyG:67,KeyY:68,KeyH:69,KeyU:70,KeyJ:71,KeyK:72,KeyO:73,KeyL:74,KeyP:75,Semicolon:76,Quote:77};
addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey)return;const m=CODE[e.code];if(m!=null){e.preventDefault();noteOn(m,.8)}
  else if(e.code==='Space'&&screen==='play'&&!ov.hidden){e.preventDefault();ov.querySelector('.btn')?.click()}});
addEventListener('keyup',e=>{const m=CODE[e.code];if(m!=null)noteOff(m)});

  WH.forEach((m,i)=>{const x=i/WH.length*SW;ctx.beginPath();ctx.moveTo(x,SH);ctx.lineTo(xOf(x,4),yOf(4));ctx.stroke()});
  ctx.beginPath();ctx.moveTo(SW,SH);ctx.lineTo(xOf(SW,4),yOf(4));ctx.stroke();

    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.moveTo(L.x,SH);ctx.lineTo(L.x+L.w,SH);ctx.lineTo(xOf(L.x+L.w,4),yOf(4));ctx.lineTo(xOf(L.x,4),yOf(4));ctx.closePath();ctx.fill()}

    setTargets(hint&&nxt?nxt.pcs.map(p=>({m:60+p+(p<pc(60)?12:0)})):[])},
  draw(dt){bgDark('#05060f','#0c0d22','#161436');
    for(let i=0;i<60;i++){ctx.fillStyle=`rgba(255,255,255,${.15+(i%4)*.1})`;ctx.fillRect((i*97)%SW,((i*61)+gs.t*8*(1+i%3))%SH,2,2)}
    for(const r of gs.rocks){if(r.dead)continue;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.spin);ctx.fillStyle='#3b3550';ctx.strokeStyle=col(r.root,60);ctx.lineWidth=2.5;ctx.shadowColor=col(r.root,60,.8);ctx.shadowBlur=14;
      ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2,rr2=r.r*(.8+.25*Math.sin(i*2.3));ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      ctx.fillStyle='#fff';ctx.font=`600 ${Math.round(r.r*.7)}px Bricolage Grotesque, system-ui`;ctx.textAlign='center';ctx.fillText(chordName(r.root,r.minor),r.x,r.y+r.r*.25)}
    for(const l of gs.lasers){ctx.strokeStyle=`rgba(242,106,94,${l.life})`;ctx.lineWidth=4*l.life;ctx.beginPath();ctx.moveTo(SW/2,SH);ctx.lineTo(l.x,l.y);ctx.stroke()}
    ctx.fillStyle=C.coral;ctx.beginPath();ctx.moveTo(SW/2,SH-26);ctx.lineTo(SW/2-18,SH);ctx.lineTo(SW/2+18,SH);ctx.closePath();ctx.fill();
    if(gs.running){const nxt=gs.rocks.filter(r=>!r.dead).sort((a,b)=>b.y-a.y)[0];if(nxt)centerText(chordName(nxt.root,nxt.minor)+' = '+nxt.pcs.map(p=>showNames?NAMES[p]:EN[p]).join(' + '),28,15,400,C.muted)}
    drawFx(dt)}};

/* --- 4. Gamme Climber --- */
const SCALES=[{n:tr('scales')[0],root:60,st:[0,2,4,5,7,9,11,12],f:[1,2,3,1,2,3,4,5]},{n:tr('scales')[1],root:67,st:[0,2,4,5,7,9,11,12],f:[1,2,3,1,2,3,4,5]},{n:tr('scales')[2],root:65,st:[0,2,4,5,7,9,11,12],f:[1,2,3,4,1,2,3,4]},{n:tr('scales')[3],root:69,st:[0,2,3,5,7,8,10,12],f:[1,2,3,1,2,3,4,5]}];
GAME.climber={lives:false,timed:true,tools:['names','fing','hint'],sc:0,
  options(){return`<div class="seg" id="scSeg">${SCALES.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===GAME.climber.sc}">${s.n}</button>`).join('')}</div>`},
  reset(){gs={running:false,score:0,time:60,step:0,dir:1,floor:0,laps:0,shake:0,t:0};fx.length=0;pops.length=0;ghud();
    setTimeout(()=>document.querySelectorAll('#scSeg button').forEach(b=>b.onclick=()=>{GAME.climber.sc=+b.dataset.i;document.querySelectorAll('#scSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b))}),0)},
  begin(){GAME.climber.reset();ov.hidden=true;gs.running=true;GAME.climber.aim()},
  stop(){gs.running=false},
  cur(){const s=SCALES[GAME.climber.sc];const i=gs.dir>0?gs.step:7-gs.step;return{m:s.root+s.st[i],f:s.f[i]}},
  aim(){const c=GAME.climber.cur();const m=c.m>HIGH?c.m-12:c.m;setTargets(hint?[{m,f:c.f}]:[])},
  press(m){if(!gs.running)return;const c=GAME.climber.cur();
    if(pc(m)===pc(c.m)){gs.step++;gs.floor++;const gain=10+gs.laps*5;gs.score+=gain;burst(m>HIGH?m-12:m,.6);blip(500+gs.floor*20,.08,'triangle',.06);
      if(gs.step>7){gs.step=0;gs.dir*=-1;if(gs.dir>0)gs.laps++;pop(gs.dir>0?tr('up'):tr('down'),SW/2,SH*.3,'good')}}
    else{gs.floor=Math.max(0,gs.floor-1);gs.shake=.3;blip(140,.15,'sawtooth',.06);popLane(tr('slip'),m,'bad')}
    GAME.climber.aim();ghud()},
  update(dt){gs.t+=dt;if(gs.shake>0)gs.shake-=dt;if(!gs.running)return;if(tick(dt))endGame('climber',`<p>${tr('floors')(gs.floor,gs.laps)}</p>`)},
  draw(dt){const sx=gs.shake>0&&!RM?(Math.random()-.5)*10:0;ctx.save();ctx.translate(sx,0);bgDark('#06120c','#0b2416','#0f3a22');
    const s=SCALES[GAME.climber.sc],n=16,h=SH*.9/n,w=SW*.22,x0=SW/2-w/2,base=SH-10-gs.floor*h*0;
    for(let i=0;i<n;i++){const y=SH-10-(i+1)*h+ (gs.floor>8?(gs.floor-8)*h:0);if(y>SH||y<-h)continue;const idx=i%8,m=s.root+s.st[idx],on=i<gs.floor;
      ctx.fillStyle=on?col(m,58):'rgba(255,255,255,.06)';ctx.strokeStyle=on?col(m,70):'rgba(255,255,255,.15)';ctx.lineWidth=1.5;rr(x0+(i%2?12:-12),y+3,w,h-6,8);ctx.fill();ctx.stroke();
      ctx.fillStyle=on?'#0f0e14':C.muted;ctx.font='500 13px Bricolage Grotesque, system-ui';ctx.textAlign='center';ctx.fillText((showNames?NAMES[pc(m)]:EN[pc(m)])+(showFing?' · '+s.f[idx]:''),x0+(i%2?12:-12)+w/2,y+h/2+4)}
    const c=GAME.climber.cur();centerText((gs.dir>0?'↑ ':'↓ ')+(showNames?NAMES[pc(c.m)]:EN[pc(c.m)])+(showFing?tr('finger')+c.f:''),30,20,500);
    ctx.fillStyle=C.muted;ctx.font='400 13px Bricolage Grotesque, system-ui';ctx.textAlign='left';ctx.fillText(s.n+tr('floor')+gs.floor,16,SH-16);
    drawFx(dt);ctx.restore()}};

/* --- 5. Oreille d'Or --- */
GAME.ear={lives:false,timed:false,tools:['names'],
  reset(){gs={running:false,score:0,q:0,seq:[],got:[],playing:false,msg:'',ok:0};fx.length=0;pops.length=0;ghud()},
  begin(){GAME.ear.reset();ov.hidden=true;gs.running=true;GAME.ear.ask()},
  stop(){gs.running=false},
  ask(){if(gs.q>=10){endGame('ear',`<p>${tr('earRes')(gs.ok)}</p>`);return}gs.q++;const len=gs.q<=3?1:gs.q<=7?2:3;const pool=[60,62,64,65,67,69,71,72];
    gs.seq=[];let prev=60;for(let i=0;i<len;i++){let m;do{m=pool[Math.floor(Math.random()*pool.length)]}while(m===prev);gs.seq.push(m);prev=m}
    gs.got=[];gs.msg=tr('earListen');GAME.ear.replay()},
  replay(){const g=gs;gs.playing=true;const sp=.55/speed;playNote(60,sp*.8,.5);gs.seq.forEach((m,i)=>setTimeout(()=>{if(gs===g)playNote(m,sp*.8)},(i+1)*sp*1000+300));setTimeout(()=>{if(gs!==g)return;gs.playing=false;gs.msg=tr('earYou')(gs.seq.length)},(gs.seq.length+1)*sp*1000+400)},
  press(m){if(!gs.running||gs.playing)return;gs.got.push(m);const i=gs.got.length-1;
    if(pc(m)!==pc(gs.seq[i])){gs.msg=tr('earMiss')+gs.seq.map(x=>NAMES[pc(x)]).join(' ');blip(140,.15,'sawtooth',.06);gs.playing=true;const g=gs;setTimeout(()=>{if(gs!==g)return;gs.seq.forEach((x,j)=>setTimeout(()=>{if(gs!==g)return;keyEls.get(x)?.classList.add('target');setTimeout(()=>keyEls.get(x)?.classList.remove('target'),400);playNote(x,.4)},j*500));setTimeout(()=>{if(gs===g&&gs.running)GAME.ear.ask()},gs.seq.length*500+600)},300);return}
    burst(m,.6);if(gs.got.length===gs.seq.length){gs.ok++;gs.score+=100*gs.seq.length;gs.msg=tr('bravo');blip(880,.1,'triangle',.07);gs.playing=true;const g=gs;setTimeout(()=>{if(gs===g&&gs.running)GAME.ear.ask()},700)}ghud()},
  update(dt){},
  draw(dt){bgDark('#14110a','#2a2210','#3f3314');const cx=SW/2,cy=SH*.46;
    for(let i=0;i<4;i++){const r=40+i*34+(gs.playing?Math.sin(performance.now()/300+i)*6:0);ctx.strokeStyle=`rgba(231,195,68,${.5-i*.11})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke()}
    centerText(gs.playing?'♪':'?',cy+16,46,700);
    centerText(gs.msg,SH-40,18,400);
    ctx.textAlign='left';ctx.fillStyle=C.muted;ctx.font='400 14px Bricolage Grotesque, system-ui';ctx.fillText(tr('question')+' '+gs.q+' / 10',16,30);
    const dots=gs.seq.map((m,i)=>i<gs.got.length?(pc(gs.got[i])===pc(m)?'●':'✕'):'○').join('  ');centerText(dots,cy+70,20,400,C.sun);
    if(!gs.playing&&gs.running){ctx.fillStyle=C.muted;ctx.font='400 13px Bricolage Grotesque, system-ui';ctx.textAlign='right';ctx.fillText(tr('earReplay'),SW-16,30)}
    drawFx(dt)}};
GAME.ear.begin=function(){if(mode==='ear'&&gs&&gs.running&&!gs.playing&&gs.q>0&&ov.hidden){GAME.ear.replay();return}GAME.ear.reset();ov.hidden=true;gs.running=true;GAME.ear.ask()};

/* --- 6. Partition Express --- */
GAME.staff={lives:true,timed:false,tools:['names','speed','hint'],
  reset(){gs={running:false,score:0,lives:3,notes:[],timer:.5,t:0,streak:0,hit:0};fx.length=0;pops.length=0;ghud()},
  begin(){GAME.staff.reset();ov.hidden=true;gs.running=true},
  stop(){gs.running=false},
  pool(){const p=[60,62,64,65,67];if(gs.hit>=8)p.push(69,71,72);if(gs.hit>=18)p.push(74,76,77,79);return p},
  press(m){if(!gs.running)return;const bx=SW*.22,n=gs.notes.find(o=>!o.done&&Math.abs(o.x-bx)<SW*.09);
    if(n&&pc(n.m)===pc(m)&&Math.abs(n.m-m)<=12){n.done='ok';gs.hit++;gs.streak++;const gain=Math.abs(n.x-bx)<SW*.03?100:60;gs.score+=gain;burstAt(n.x,n.y,n.m,14);pop(gain===100?tr('perfect'):tr('good'),n.x,n.y-30,gain===100?'good':'warn');blip(660,.08,'triangle',.06)}
    else{gs.streak=0;blip(140,.15,'sawtooth',.06);const k=keyEls.get(m);if(k){k.classList.add('wrong');setTimeout(()=>k.classList.remove('wrong'),180)}}ghud()},
  update(dt){gs.t+=dt;if(!gs.running)return;const sp=SW*.14*speed*(1+Math.min(.6,gs.hit*.02));
    gs.timer-=dt;if(gs.timer<=0){const p=GAME.staff.pool();const m=p[Math.floor(Math.random()*p.length)];gs.notes.push({m,x:SW+30,done:false});gs.timer=Math.max(.9,1.9-gs.hit*.03)/speed}
    const bx=SW*.22;for(const n of gs.notes){n.x-=sp*dt;if(!n.done&&n.x<bx-SW*.09){n.done='miss';gs.lives--;gs.streak=0;blip(110,.3,'sawtooth',.09,60);pop(tr('missed'),n.x,n.y-30,'bad');ghud();if(gs.lives<=0){endGame('staff',`<p>${tr('read')(gs.hit)}</p>`);break}}}
    gs.notes=gs.notes.filter(n=>n.x>-40);
    const nxt=gs.notes.find(n=>!n.done);setTargets(hint&&nxt&&nxt.x<bx+SW*.5?[{m:nxt.m}]:[])},
  draw(dt){bgDark('#120b0a','#241412','#3a1d19');const gap=Math.min(22,SH*.08),top=SH*.5-2*gap,bx=SW*.22;
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(20,top+i*gap);ctx.lineTo(SW-20,top+i*gap);ctx.stroke()}
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.font=`${gap*4.2}px serif`;ctx.textAlign='left';ctx.fillText('𝄞',26,top+4*gap+gap*.1);
    ctx.strokeStyle=C.coral;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,top-gap*2);ctx.lineTo(bx,top+6*gap);ctx.stroke();
    // staff position: E4 = bottom line (index 0), each white step = half gap up
    const stepOf=m=>{const w=[0,0,1,1,2,3,3,4,4,5,5,6][pc(m)]+7*(Math.floor(m/12)-1);return w-(2+7*3)};// E4 -> 0
    for(const n of gs.notes){if(n.done==='ok')continue;const st=stepOf(n.m),y=top+4*gap-st*gap/2;n.y=y;const sharp=isBlack(n.m);
      ctx.globalAlpha=n.done==='miss'?.3:1;
      if(st<=-2)for(let s=-2;s>=st;s-=2){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(n.x-gap*.9,top+4*gap-s*gap/2);ctx.lineTo(n.x+gap*.9,top+4*gap-s*gap/2);ctx.stroke()}
      if(st>=10)for(let s=10;s<=st;s+=2){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(n.x-gap*.9,top+4*gap-s*gap/2);ctx.lineTo(n.x+gap*.9,top+4*gap-s*gap/2);ctx.stroke()}
      ctx.fillStyle=col(n.m,62);ctx.shadowColor=col(n.m,60,.8);ctx.shadowBlur=12;ctx.beginPath();ctx.ellipse(n.x,y,gap*.62,gap*.46,-.35,0,7);ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle=col(n.m,62);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.x+gap*.55,y);ctx.lineTo(n.x+gap*.55,y-gap*3);ctx.stroke();
      if(sharp){ctx.fillStyle='#fff';ctx.font=`600 ${gap}px Bricolage Grotesque`;ctx.textAlign='center';ctx.fillText('♯',n.x-gap*1.1,y+gap*.35)}
      if(showNames){ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='500 12px Bricolage Grotesque, system-ui';ctx.textAlign='center';ctx.fillText(NAMES[pc(n.m)],n.x,top+6*gap+14)}ctx.globalAlpha=1}
    if(gs.running&&gs.streak>=5){ctx.fillStyle=C.text;ctx.font='600 16px Bricolage Grotesque, system-ui';ctx.textAlign='left';ctx.fillText(tr('streak')+' '+gs.streak,16,30)}
    drawFx(dt)}};

/* ================= Loop ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(screen==='play'&&HOLD){if(mode==='song'){if(sheet&&HAS_STAFF)drawSheet();else drawSong(0)}else GAME[mode].draw(0)}
  else if(screen==='play'){if(mode==='song'){updateSong(dt);if(sheet&&HAS_STAFF)drawSheet();else drawSong(dt)}else{GAME[mode].update(dt);GAME[mode].draw(dt)}}
  requestAnimationFrame(frame)}
renderHome();requestAnimationFrame(frame);
if(VIEW.startsWith('game=')&&GAMES.some(g=>g.id===VIEW.slice(5)))openGame(VIEW.slice(5));
/* ==== Import de morceaux ==== */
// #song=imp:<id>&arr=<1|2>: a song imported by the player (PLAY › Mes morceaux), read from this device (IndexedDB "pc-import", or the host's memory)
function impVariant(s,lv){const a=s.arrs.find(x=>x.lv===lv)||s.arrs[0];
  const notes=s.conv.notes.filter(n=>a.hands>1||n.h===1).map(n=>({m:n.m,s:n.s,d:n.d,h:n.h,f:n.h===1?n.f||0:0}));
  return {...s,id:a.key,level:a.lv,hands:a.hands,notes,end:Math.max(...notes.map(n=>n.s+n.d)),base:s}}
function impBase(rec){const conv=PCImp.convert(rec.model,{...rec.opts}),k='imp:'+rec.id,hasL=conv.nL>0;
  return {id:k,imp:rec.id,title:String(rec.title||'').replace(/[<>&"]/g,''),by:tr('impBy'),bpm:conv.bpm,meter:conv.meter,pickup:conv.pickup||undefined,col:'#7a5bf5',conv,
    arrs:hasL?[{lv:1,key:k,hands:1},{lv:2,key:k+'@2',hands:2}]:[{lv:1,key:k,hands:1}]}}
async function openImported(id,lv){mode='song';go('play');overlay(`<p>${tr('impLoad')}</p>`);
  let rec=null;try{rec=window.PCImp&&await PCImp.db.get(id)}catch(e){}
  if(!rec||!rec.model){overlay(`<p>${tr('impGone')}</p><div class="row"><button class="btn light" data-h>${tr('library')}</button></div>`);return}
  const b=impBase(rec);if(!b.conv.notes.length){overlay(`<p>${tr('impGone')}</p><div class="row"><button class="btn light" data-h>${tr('library')}</button></div>`);return}
  b.v0=impVariant(b,1);openSong(b,b.arrs.some(a=>a.lv===lv)?lv:1)}
if(VIEW.startsWith('song=imp:')){const ar=+((HASH.find(x=>x.startsWith('arr='))||'arr=0').slice(4));openImported(VIEW.slice(9),ar||1)}
else if(VIEW.startsWith('song=')){const id=VIEW.slice(5),ar=+((HASH.find(x=>x.startsWith('arr='))||'arr=0').slice(4)),s=SONGS.find(x=>x.id===id);
  if(s)openSong(s,ar||0);
  else if(/^[a-z]+$/.test(id)&&!window.PC_FREE){const sc=document.createElement('script');sc.src='../assets/js/songs-free.js';
    sc.onload=()=>{(window.PC_FREE||[]).forEach(d=>{if(SONGS.some(x=>x.id===d.id))return;const s={id:d.id,data:d,title:d.t[LANG==='fr'?0:1],bpm:d.bpm,meter:d.m,pickup:d.p,col:d.k,arrs:PS.arrs(d)};
      s.by=d.by==='trad'?(tr('byFrom')[d.from]||tr('trad')):d.by;s.v0=variant(s,s.arrs[0].lv);SONGS.push(s)});const f=SONGS.find(x=>x.id===id);if(f)openSong(f,ar||0)};
    document.head.appendChild(sc)}}
})();
</script>
