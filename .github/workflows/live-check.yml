name: Vérifier la mise à jour de l'app (site en ligne)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI (dev → main)"]
    types: [completed]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Attendre le déploiement OVH
        if: github.event_name == 'workflow_run'
        run: sleep 120
      - name: Comparer les fichiers servis au manifeste
        run: node tools/live_check.mjs
